<header>

    <h1>

        カシカリカシカ

    </h1>

</header>

<main>

    <!--==============================
        Balance
    ==============================-->

    <section class="card balance-card">

        <p class="balance-label">

            現在の貸し借り

        </p>

        <h2 id="balanceText">

            貸し借りなし！

        </h2>

        <p id="balanceAmount">

            ￥0

        </p>

    </section>

    <!--==============================
        Input
    ==============================-->

    <section class="card input-card">

        <div class="form-group">

            <label for="titleInput">

                タイトル（任意）

            </label>

            <input
                id="titleInput"
                type="text"
                placeholder="ラーメン">

        </div>

        <div class="form-group">

            <label for="amountInput">

                金額

            </label>

            <input
                id="amountInput"
                type="number"
                inputmode="numeric"
                placeholder="520">

        </div>

        <div class="button-row">

            <button
                id="selfButton"
                class="button button-self">

                😳 自分が払った

            </button>

            <button
                id="partnerButton"
                class="button button-partner">

                🐱 相手が払った

            </button>

        </div>

    </section>

    <!--==============================
        Settlement
    ==============================-->

    <section class="card settlement-card">

        <button
            id="settlementButton"
            class="button button-warning">

            精算する

        </button>

    </section>

    <!--==============================
        History
    ==============================-->

    <section class="history-section">

        <h2>

            履歴

        </h2>

        <div id="historyList">

        </div>

    </section>

</main>


<!--==============================
    Navigation
==============================-->

<nav class="bottom-navigation">

    <button
        id="moneyTab"
        class="nav-button active">

        <span class="nav-icon">

            🏠

        </span>

        <span class="nav-label">

            貸し借り

        </span>

    </button>

    <button
        id="settingsTab"
        class="nav-button">

        <span class="nav-icon">

            ⚙️

        </span>

        <span class="nav-label">

            設定

        </span>

    </button>

</nav>
