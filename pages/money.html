<header>

<img
    src="kashi.PNG"
    alt="カシカリカシカ"
    class="header-logo">

</header>

<main>

    <!--==============================
        Balance
    ==============================-->

    <section class="card balance-card">

        <p class="balance-label">

            現在の貸し借り

        </p>

        <h2 id="balanceText">

            貸し借りなし！

        </h2>

        <p id="balanceAmount">

            ￥0

        </p>

        <button
            id="settlementButton"
            class="button button-settlement">

            <img
                src="nashi.PNG"
                alt="カシカリナシカ"
                class="settlement-logo">

        </button>

    </section>

    <!--==============================
        Input
    ==============================-->

    <section class="card input-card">

        <div class="form-group">

            <label for="titleInput">

                タイトル（任意）

            </label>

            <input
                id="titleInput"
                type="text"
                placeholder="ラーメン">

        </div>

        <div class="form-group">

            <label for="amountInput">

                金額

            </label>

            <input
                id="amountInput"
                type="number"
                inputmode="numeric"
                placeholder="520">

        </div>

        <div class="button-row">

            <button
                id="selfButton"
                class="button button-self">

            </button>

            <button
                id="partnerButton"
                class="button button-partner">

            </button>

        </div>

    </section>

    <!--==============================
        History
    ==============================-->

    <section class="history-section">

        <h2>

            履歴

        </h2>

        <div id="historyList">

        </div>

    </section>

</main>

<!--==============================
    Navigation
==============================-->

<nav class="bottom-navigation">

    <button
        id="moneyTab"
        class="nav-button active">

        <img
            src="kashi.PNG"
            alt="貸し借り"
            class="nav-icon-image">

        <span class="nav-label">

            貸し借り

        </span>

    </button>

    <button
        id="historyTab"
        class="nav-button">

        <img
            src="rireki.PNG"
            alt="履歴"
            class="nav-icon-image">

        <span class="nav-label">

            履歴

        </span>

    </button>

    <button
        id="settingsTab"
        class="nav-button">

        <img
            src="settei.PNG"
            alt="設定"
            class="nav-icon-image">

        <span class="nav-label">

            設定

        </span>

    </button>

</nav>
