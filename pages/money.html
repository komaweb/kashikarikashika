<header>

<header>

    <img
        src="kashikari.PNG"
        alt="カシカリカシカ"
        class="header-logo">

</header>

</header>

<main>

    <!--==============================
        Balance
    ==============================-->

    <section class="card balance-card">

        <p class="balance-label">

            現在の貸し借り

        </p>

        <h2 id="balanceText">

            貸し借りなし！

        </h2>

        <p id="balanceAmount">

            ￥0

        </p>

        <button
            id="settlementButton"
            class="button button-settlement">

            カシカリナシカ

        </button>

    </section>

    <!--==============================
        Input
    ==============================-->

    <section class="card input-card">

        <div class="form-group">

            <label for="titleInput">

                タイトル（任意）

            </label>

            <input
                id="titleInput"
                type="text"
                placeholder="ラーメン">

        </div>

        <div class="form-group">

            <label for="amountInput">

                金額

            </label>

            <input
                id="amountInput"
                type="number"
                inputmode="numeric"
                placeholder="520">

        </div>

<div class="button-row">

    <button
        id="selfButton"
        class="button button-self">

    </button>

    <button
        id="partnerButton"
        class="button button-partner">

    </button>

</div>

    </section>

    <!--==============================
        History
    ==============================-->

    <section class="history-section">

        <h2>

            履歴

        </h2>

        <div id="historyList">

        </div>

    </section>

</main>

    Navigation
==============================-->

        </span>

    </button>
