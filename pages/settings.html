<header>

    <h1>

        カシカリカシカ

    </h1>

</header>

<main>

    <!--==============================
        自分
    ==============================-->

    <section class="card settings-card">

        <h2>

            自分

        </h2>

        <div class="form-group">

            <label for="selfName">

                名前

            </label>

            <input
                id="selfName"
                type="text"
                maxlength="20">

        </div>

        <div class="form-group">

            <label for="selfIcon">

                アイコン（絵文字）

            </label>

            <input
                id="selfIcon"
                type="text"
                maxlength="2"
                placeholder="😳">

        </div>

    </section>

    <!--==============================
        相手
    ==============================-->

    <section class="card settings-card">

        <h2>

            相手

        </h2>

        <div class="form-group">

            <label for="partnerName">

                名前

            </label>

            <input
                id="partnerName"
                type="text"
                maxlength="20">

        </div>

        <div class="form-group">

            <label for="partnerIcon">

                アイコン（絵文字）

            </label>

            <input
                id="partnerIcon"
                type="text"
                maxlength="2"
                placeholder="🐱">

        </div>

    </section>

    <!--==============================
        保存
    ==============================-->

    <section class="card settings-card">

        <button
            id="saveSettingsButton"
            class="button button-self">

            保存

        </button>

    </section>

</main>
