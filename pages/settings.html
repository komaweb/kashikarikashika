<header>

    <img
        src="kashikari.PNG"
        alt="カシカリカシカ"
        class="header-logo">

</header>

<main>

    <!--==============================
        自分
    ==============================-->

    <section class="card settings-card">

        <h2>

            自分

        </h2>

        <div class="form-group">

            <label for="selfName">

                名前

            </label>

            <input
                id="selfName"
                type="text"
                maxlength="20">

        </div>

        <div class="form-group">

            <label>

                アイコン

            </label>

            <div class="icon-setting">

                <img
                    id="selfIconPreview"
                    class="settings-icon-preview">

                <input
                    id="selfIcon"
                    type="file"
                    accept="image/*"
                    hidden>

                <button
                    id="selfIconButton"
                    class="button button-self"
                    type="button">

                    画像を選択

                </button>

            </div>

        </div>

    </section>

    <!--==============================
        相手
    ==============================-->

    <section class="card settings-card">

        <h2>

            相手

        </h2>

        <div class="form-group">

            <label for="partnerName">

                名前

            </label>

            <input
                id="partnerName"
                type="text"
                maxlength="20">

        </div>

        <div class="form-group">

            <label>

                アイコン

            </label>

            <div class="icon-setting">

                <img
                    id="partnerIconPreview"
                    class="settings-icon-preview">

                <input
                    id="partnerIcon"
                    type="file"
                    accept="image/*"
                    hidden>

                <button
                    id="partnerIconButton"
                    class="button button-partner"
                    type="button">

                    画像を選択

                </button>

            </div>

        </div>

    </section>

    <!--==============================
        保存
    ==============================-->

    <section class="card settings-card">

        <button
            id="saveSettingsButton"
            class="button button-self">

            保存

        </button>

    </section>

</main>

<nav class="bottom-navigation">

    <button
        id="moneyTab"
        class="nav-button">

        <img
            src="kashi.PNG"
            alt="貸し借り"
            class="nav-icon-image">

        <span class="nav-label">

            貸し借り

        </span>

    </button>

    <button
        id="historyTab"
        class="nav-button">

        <img
            src="rireki.PNG"
            alt="履歴"
            class="nav-icon-image">

        <span class="nav-label">

            履歴

        </span>

    </button>

    <button
        id="settingsTab"
        class="nav-button active">

        <img
            src="settei.PNG"
            alt="設定"
            class="nav-icon-image">

        <span class="nav-label">

            設定

        </span>

    </button>

</nav>
