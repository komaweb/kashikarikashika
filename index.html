<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>カシカリカシカ</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<header>

    <h1>

        カシカリカシカ

    </h1>

</header>

<main>

<!-- 残高 -->

<section
class="balance-card">

<p class="balance-label">

現在の貸し借り

</p>

<h2 id="balanceText">

精算済み！

</h2>

<p
id="balanceAmount">

￥0

</p>

</section>

<!-- 登録 -->

<section
class="input-card">

<div class="field">

<label>

タイトル

</label>

<input
id="titleInput"
type="text"
placeholder="ラーメン">

</div>

<div class="field">

<label>

金額

</label>

<input
id="amountInput"
type="number"
placeholder="520">

</div>

<div class="button-row">

<button
id="selfButton">

自分が払った

</button>

<button
id="partnerButton">

相手が払った

</button>

</div>

</section>

<!-- 精算 -->

<section
class="settlement-card">

<button
id="settlementButton">

精算する

</button>

</section>

<!-- 履歴 -->

<section
class="history-section">

<h2>

履歴

</h2>

<div
id="historyList">

<p class="empty">

履歴はまだありません

</p>

</div>

</section>

</main>

</div>

<script
type="module"
src="js/app.js">

</script>

</body>

</html>
